name: Release macOS Universal DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & macOS universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install librsvg for .icns icon generation
        run: brew install librsvg

      - name: Run unit tests
        run: cargo test

      - name: Build Universal Murmur.app and DMG
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh --universal

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-macOS-Universal-DMG
          path: dist/Murmur-macOS.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Murmur-macOS.dmg
